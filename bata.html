<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>หน้าข้อมูลทีม</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --brand: #0ea5e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans", Arial, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .wrap {
      max-width: 960px; margin: 40px auto; padding: 0 20px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }
    header {
      text-align: center; margin-bottom: 20px;
    }
    .logo {
      width: 180px; height: auto; display: block; margin: 0 auto 12px auto;
      transition: transform 0.2s ease;
    }
    .logo:hover {
      transform: scale(1.05);
    }
    .subtitle {
      font-size: 18px; color: var(--muted);
    }
    figure {
      margin: 22px auto; text-align: center;
    }
    .group-photo {
      width: 100%; max-width: 720px; height: auto; border-radius: 16px; border: 1px solid var(--border);
    }
    figcaption {
      margin-top: 8px; color: var(--muted); font-size: 14px;
    }
    .list-title {
      margin: 24px 0 8px; font-size: 20px; font-weight: 700;
      border-left: 4px solid var(--brand); padding-left: 10px;
    }
    ul.members {
      list-style: none; padding: 0; margin: 0;
      display: grid; grid-template-columns: 1fr; gap: 10px;
    }
    @media (min-width: 640px) {
      ul.members { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 960px) {
      ul.members { grid-template-columns: 1fr 1fr 1fr; }
    }
    .member {
      background: #fff; border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
    }
    .name { font-weight: 700; }
    .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
    footer {
      margin-top: 26px; text-align: center; color: var(--muted); font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <a href="https://taithai-tai.github.io/sukishi/home/" target="_blank" rel="noopener noreferrer">
          <img class="logo" src="https://www.sukishigroup.com/Sukishi/wp-content/uploads/2018/05/Logo-W-Web-03-1.png" alt="โลโก้ Sukishi" />
        </a>
        <div class="subtitle">จะทำโดย</div>
      </header>

      <main>
        <figure>
          <img class="group-photo" src="https://ik.imagekit.io/v7mbyb6ok/IMG_9023.heic" alt="รูปกลุ่มของฉัน (JPG)" />
          <figcaption></figcaption>
        </figure>

        <h2 class="list-title">รายชื่อสมาชิกกลุ่ม</h2>
        <ul class="members" aria-label="รายชื่อสมาชิก">
          <li class="member">
            <div class="name">ขวัญฤทัย มาเจริญ</div>
            <div class="meta">รหัส 1660202365 · No.11</div>
          </li>
          <li class="member">
            <div class="name">ธนากรณ์ บุญนุ้ย</div>
            <div class="meta">รหัส 1660203918 · No.12</div>
          </li>
          <li class="member">
            <div class="name">ดนุพล แสงนคร</div>
            <div class="meta">รหัส 1660210079 · No.17</div>
          </li>
          <li class="member">
            <div class="name">ธนวินท์ บุบผา</div>
            <div class="meta">รหัส 1660207703 · No.15</div>
          </li>
          <li class="member">
            <div class="name">ธนพร ทองเฝือ</div>
            <div class="meta">รหัส 1660225747 · No.68</div>
          </li>
        </ul>
      </main>

      <footer>
      </footer>
    </div>
  </div>
</body>
</html>
