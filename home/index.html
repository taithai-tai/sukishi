<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตรวจสอบวันหมดอายุสินค้า • Expiry Check</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="description" content="หน้าเว็บสำหรับตรวจสอบวันหมดอายุสินค้า แสดงเค้าท์ดาวน์ รูปสินค้า และรายละเอียด"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E⏳%3C/text%3E%3C/svg%3E">
  <style>
    body{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans Thai', 'Noto Sans', 'Helvetica Neue', Arial, 'Apple Color Emoji','Segoe UI Emoji';}
    .count-box{ @apply flex flex-col items-center justify-center rounded-2xl p-4 shadow border bg-white; }
    .count-value{ @apply text-4xl md:text-5xl font-bold; }
    .count-label{ @apply text-xs md:text-sm text-gray-500; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-50 to-white text-gray-900">
  <div class="mx-auto max-w-5xl p-6 md:p-10">
    <!-- Header -->
    <div class="flex justify-center mb-6">
      <img src="https://www.sukishigroup.com/Sukishi/wp-content/uploads/2018/05/Logo-W-Web-03-1.png" alt="Sukishi Logo" class="h-40 w-auto">
    </div>
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">ตรวจสอบวันหมดอายุสินค้า</h1>
        <p class="text-gray-600">ดูวันหมดอายุ เค้าท์ดาวน์ และรายละเอียดสินค้าได้ทันที</p>
      </div>
    </header>

    <!-- Main Card -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <!-- Product Images -->
      <div class="bg-white border rounded-2xl p-4 shadow-sm flex flex-col space-y-4">
        <div class="aspect-square overflow-hidden rounded-xl bg-gray-50 border flex items-center justify-center">
          <img alt="รูปสินค้าด้านหน้า" class="max-h-full max-w-full object-contain" src="https://ik.imagekit.io/v7mbyb6ok/7.jpg" />
        </div>
        <div class="aspect-square overflow-hidden rounded-xl bg-gray-50 border flex items-center justify-center">
          <img alt="รูปสินค้าด้านหลัง" class="max-h-full max-w-full object-contain" src="https://ik.imagekit.io/v7mbyb6ok/9.jpg" />
        </div>
      </div>

      <!-- Countdown + Status -->
      <div class="bg-white border rounded-2xl p-5 shadow-sm">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h2 id="productName" class="text-xl md:text-2xl font-bold">ชื่อสินค้า</h2>
            <p class="text-gray-600" id="productDesc">คำอธิบายสั้น ๆ ของสินค้า</p>
          </div>
          <span id="statusBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-semibold border">สถานะ</span>
        </div>

        <div class="mt-5 grid grid-cols-4 gap-3">
          <div class="count-box"><div id="d" class="count-value">0</div><div class="count-label">วัน</div></div>
          <div class="count-box"><div id="h" class="count-value">00</div><div class="count-label">ชั่วโมง</div></div>
          <div class="count-box"><div id="m" class="count-value">00</div><div class="count-label">นาที</div></div>
          <div class="count-box"><div id="s" class="count-value">00</div><div class="count-label">วินาที</div></div>
        </div>

        <div class="mt-6">
          <div class="flex items-center justify-between mb-1 text-sm text-gray-600">
            <span>ความสดใหม่</span>
            <span id="freshPctLabel">0%</span>
          </div>
          <div class="w-full h-3 bg-gray-100 rounded-full overflow-hidden">
            <div id="freshPctBar" class="h-3 bg-emerald-500" style="width:0%"></div>
          </div>
        </div>

        <dl class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
          <div><dt class="text-gray-500">รหัสสินค้า (SKU)</dt><dd id="sku" class="font-medium">-</dd></div>
          <div><dt class="text-gray-500">ล็อตการผลิต (LOT)</dt><dd id="lot" class="font-medium">-</dd></div>
          <div><dt class="text-gray-500">วันที่ผลิต (MFG)</dt><dd id="mfg" class="font-medium">-</dd></div>
          <div><dt class="text-gray-500">วันหมดอายุ (EXP)</dt><dd id="exp" class="font-medium">-</dd></div>
          <div class="sm:col-span-2"><dt class="text-gray-500">หมายเหตุ</dt><dd id="note" class="font-medium">-</dd></div>
        </dl>
      </div>
    </section>

    <!-- Join Button -->
    <div class="flex justify-center mt-6">
      <button onclick="window.location.href='https://play.famobi.com/om-nom-run';" class="px-6 py-3 bg-black text-white rounded-xl text-lg font-semibold hover:bg-gray-800 transition">เข้าร่วมกิจกรรม</button>
    </div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const fmtTH = (d)=> d? new Intl.DateTimeFormat('th-TH', { dateStyle:'medium', timeStyle: d.toString().includes(':')? 'short': undefined }).format(d): '-';

    const params = new URLSearchParams(location.search);
    const state = {
      name: params.get('name') || 'MAT JJANG กิมจิผักกาดขาว',
      desc: params.get('desc') || 'กิมจิผักกาดขาว ตรามัทจัง รสชาติเกาหลีแท้ สดใหม่ 150 กรัม',
      sku:  params.get('sku')  || 'KJ150',
      lot:  params.get('lot')  || 'LOT2409',
      mfg:  params.get('mfg')  || '2025-09-01T08:00',
      exp:  params.get('exp')  || '2025-12-31T23:59',
      note: params.get('note') || 'เก็บในตู้เย็น 0-4°C'
    };

    const dE = $('d'), hE=$('h'), mE=$('m'), sE=$('s');
    const badge = $('statusBadge');
    const freshBar = $('freshPctBar');
    const freshLbl = $('freshPctLabel');

    function parseMaybeDate(val){
      if(!val) return null;
      if(/^\d{4}-\d{2}-\d{2}$/.test(val)){
        const d = new Date(val + 'T23:59:59');
        return isNaN(d)? null: d;
      }
      const d = new Date(val);
      return isNaN(d)? null: d;
    }

    function renderInfo(){
      $('productName').textContent = state.name;
      $('productDesc').textContent = state.desc;
      $('sku').textContent = state.sku;
      $('lot').textContent = state.lot;
      const mfgD = parseMaybeDate(state.mfg);
      const expD = parseMaybeDate(state.exp);
      $('mfg').textContent = mfgD? fmtTH(mfgD): '-';
      $('exp').textContent = expD? fmtTH(expD): '-';
      $('note').textContent = state.note;

      const now = new Date();
      let status = '—', color = 'border-gray-300 text-gray-700 bg-gray-50';
      if(expD){
        const diff = expD - now;
        if(diff < 0){ status = 'หมดอายุแล้ว'; color = 'border-rose-200 text-rose-700 bg-rose-50'; }
        else if(diff < 24*3600*1000){ status = 'หมดอายุวันนี้'; color = 'border-amber-200 text-amber-700 bg-amber-50'; }
        else if(diff <= 7*24*3600*1000){ status = 'ใกล้หมดอายุ'; color = 'border-amber-200 text-amber-700 bg-amber-50'; }
        else { status = 'ยังใช้ได้'; color = 'border-emerald-200 text-emerald-700 bg-emerald-50'; }
      }
      badge.className = 'inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-semibold border ' + color;
      badge.textContent = status;

      let pct = 0;
      if(mfgD && expD){
        const total = expD - mfgD;
        const used = now - mfgD;
        pct = Math.max(0, Math.min(100, 100 - (used/total*100)));
      } else if(expD){
        const used = (now - (new Date(expD.getTime()-30*24*3600*1000)));
        pct = Math.max(0, Math.min(100, 100 - (used/(30*24*3600*1000)*100)));
      }
      freshBar.style.width = pct.toFixed(0)+"%";
      freshBar.className = 'h-3 rounded-full ' + (pct<=15? 'bg-rose-500': pct<=40? 'bg-amber-500': 'bg-emerald-500');
      freshLbl.textContent = pct.toFixed(0)+"%";
    }

    function tick(){
      const expD = parseMaybeDate(state.exp);
      if(!expD){ dE.textContent='0'; hE.textContent=mE.textContent=sE.textContent='00'; return; }
      const now = new Date();
      let diff = Math.max(0, expD - now);
      const days = Math.floor(diff/(24*3600*1000)); diff -= days*24*3600*1000;
      const hours= Math.floor(diff/(3600*1000)); diff -= hours*3600*1000;
      const mins = Math.floor(diff/(60*1000)); diff -= mins*60*1000;
      const secs = Math.floor(diff/1000);
      dE.textContent = days;
      hE.textContent = String(hours).padStart(2,'0');
      mE.textContent = String(mins).padStart(2,'0');
      sE.textContent = String(secs).padStart(2,'0');
    }

    renderInfo();
    tick();
    setInterval(()=>{ tick(); renderInfo(); }, 1000);
  </script>
</body>
</html>
